<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Profil</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8e8ef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 90%;
            text-align: center;
        }

        .title {
            color: #c242b5;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        .profile-container {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .profile-card {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 18px;
            border-top: 5px solid #c242b5;
            box-shadow: 0 10px 25px rgba(194, 66, 181, 0.15);
            text-decoration: none;
            transition: 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(194, 66, 181, 0.25);
        }

        .profile-photo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #c242b5;
            margin-bottom: 15px;
        }

        .profile-name {
            color: #c242b5;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .profile-nim {
            color: #666;
            font-size: 14px;
        }

        .footer {
            margin-top: 35px;
            color: #c242b5;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .profile-container {
                flex-direction: column;
                align-items: center;
            }

            .profile-card {
                width: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="title">Kelompok Coder_Sukses</h1>
        <p class="subtitle">Pilih profil untuk melihat informasi lengkap</p>

        <div class="profile-container">

            <a href="profiles/profilAquila.html" class="profile-card">
                <img src="profil_img/aquila.jpeg" alt="Foto Profil 1" class="profile-photo">

                <h2 class="profile-name">Aquila Raskha Malika</h2>
                <p class="profile-nim">NIM: 2025081011</p>
            </a>

            <a href="profiles/profil.html" class="profile-card">
                <img src="profil_img/foto2.jpg" alt="Foto Profil 2" class="profile-photo">

                <h2 class="profile-name">Benedictus Bevan Damara</h2>
                <p class="profile-nim">NIM: 2025081024</p>
            </a>

            <a href="profiles/profil.html" class="profile-card">
                <img src="profil_img/foto3.jpg" alt="Foto Profil 3" class="profile-photo">

                <h2 class="profile-name">Muhammad Albana Hafit</h2>
                <p class="profile-nim">NIM: 2025081005</p>
            </a>

        </div>

        <div class="footer">
            © 2026 Daftar Profil
        </div>

    </div>

</body>
</html>
